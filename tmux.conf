# tmux settings for Neovim, Claude Code and Codex in panes. Needs tmux 3.6 or later
# (install-linux.sh and Homebrew install 3.8; Ubuntu 24.04's package is 3.4). Link it as
# ~/.config/tmux/tmux.conf; `tmux source ~/.config/tmux/tmux.conf` reloads it.
#
# tmux's defaults already cover the rest: Esc waits only 10 ms, the mouse is on (3.8), and
# 24-bit color is used when the terminal sets COLORTERM=truecolor. The prefix stays C-b.

# Focus changes reach programs: Neovim's autoread, and Claude Code notifies only when you
# have looked away.
set -g focus-events on

# Shift+Enter inserts a newline in Claude Code and Codex, from terminals that send it
# distinctly (GNOME Terminal does not; Ctrl+J works everywhere). Programs that ask for
# extended keys (Claude Code, Neovim) get them; Codex asks only for the kitty keyboard
# protocol, which tmux lacks, so it is handed Shift+Enter as CSI u. Forcing that on every
# pane (extended-keys always) would garble Shift+Space and Ctrl+Backspace in shells.
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
bind -n S-Enter if -F '#{==:#{pane_current_command},codex}' \
  { send-keys -H 1b 5b 31 33 3b 32 75 } { send-keys S-Enter }

# Curly, colored underlines for LSP diagnostics.
set -as terminal-features 'xterm-256color:usstyle'

# Desktop notifications from Claude Code and Codex reach the outer terminal.
set -g allow-passthrough on

# Copies go to the system clipboard where the terminal supports OSC 52 (GNOME Terminal does
# not: there, Shift+drag selects natively and Ctrl+Shift+C copies). On macOS they also go
# through pbcopy, because Apple's Terminal ignores OSC 52.
set -s set-clipboard on
if -b 'command -v pbcopy >/dev/null' { set -s copy-command pbcopy }

# Scroll back through long agent transcripts with the wheel or C-b [.
set -g history-limit 50000
set -g mode-keys vi

# Copy mode selects like Vim: v starts a selection (C-v then makes it a block), V selects
# lines, y copies. Enter still copies too.
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel

# The terminal's title shows the active pane's title, which Claude Code and Codex set to
# the session's state.
set -g set-titles on
set -g set-titles-string '#T'

# New windows and splits start in the current pane's directory. The notes (-N) keep these
# keys in C-b ?, which lists only keys that have one.
bind -N 'Create a new window' c new-window -c '#{pane_current_path}'
bind -N 'Split window vertically' '"' split-window -v -c '#{pane_current_path}'
bind -N 'Split window horizontally' % split-window -h -c '#{pane_current_path}'

# Alt+drag moves a floating pane. Over a tiled pane, where tmux has nothing to move, it goes
# to the program instead, so Neovim's Alt+drag block selection follows the mouse.
bind -n M-MouseDrag1Pane if -F '#{pane_floating_flag}' { move-pane -M } { send-keys -M }

# Sessions outlive a closed terminal, but not a reboot. tmux-resurrect saves them (C-b C-s)
# and brings them back (C-b C-r); tmux-continuum saves every 15 minutes and restores when the
# tmux server starts. Neovim reopens its files, Claude Code and Codex resume the latest
# conversation in their directory (without the flags they were started with), and other
# panes get a shell in the same directory. install-linux.sh puts the plugins in
# ~/.local/share/tmux/plugins. Codex from npm runs under its binary's full path, hence the
# `~bin/codex` entry. Keep this last: continuum hooks into status-right.
set -g @resurrect-processes '"claude->claude --continue" "codex->codex resume --last" "~bin/codex->codex resume --last"'
set -g @continuum-restore on
run-shell 'd=${XDG_DATA_HOME:-$HOME/.local/share}/tmux/plugins; for p in tmux-resurrect/resurrect.tmux tmux-continuum/continuum.tmux; do [ ! -x "$d/$p" ] || "$d/$p" >/dev/null 2>&1; done; true'
if -F '#{@resurrect-save-script-path}' {
  bind -N 'Save the sessions now (tmux-resurrect)' C-s run-shell '#{@resurrect-save-script-path}'
  bind -N 'Restore the last saved sessions (tmux-resurrect)' C-r run-shell '#{@resurrect-restore-script-path}'
}
